<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>交通量データ取得テスト</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1f2937;--sub:#6b7280;--ok:#0f766e;--ng:#b91c1c;--warn:#a16207;--line:#e5e7eb;--accent:#1d4ed8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;font-size:15px;line-height:1.55}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:19px;margin:4px 0 4px}
p.lead{color:var(--sub);margin:0 0 14px;font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap}
button{flex:1 1 140px;font:inherit;font-weight:700;padding:12px;border-radius:10px;border:1px solid var(--accent);background:var(--accent);color:#fff}
button.sub{background:#fff;color:var(--accent)}
button:disabled{opacity:.5}
#point{font-size:13px;color:var(--sub);margin-top:8px}
.verdict{font-size:17px;font-weight:800;padding:12px;border-radius:10px;margin-bottom:12px;display:none}
.verdict.ok{display:block;background:#ecfdf5;color:var(--ok);border:1px solid #a7f3d0}
.verdict.ng{display:block;background:#fef2f2;color:var(--ng);border:1px solid #fecaca}
.verdict.warn{display:block;background:#fffbeb;color:var(--warn);border:1px solid #fde68a}
.verdict small{display:block;font-weight:500;font-size:13px;margin-top:4px;color:var(--ink)}
ul{list-style:none;margin:0;padding:0}
li{padding:8px 0;border-top:1px solid var(--line);font-size:13px;word-break:break-all}
li:first-child{border-top:0}
.tag{display:inline-block;min-width:64px;text-align:center;font-weight:800;font-size:12px;border-radius:6px;padding:1px 6px;margin-right:6px}
.tag.ok{background:#ccfbf1;color:var(--ok)}.tag.ng{background:#fee2e2;color:var(--ng)}.tag.warn{background:#fef3c7;color:var(--warn)}.tag.wait{background:#e5e7eb;color:var(--sub)}
.url{color:var(--sub);font-size:11px}
footer{color:var(--sub);font-size:11px;margin-top:8px}
</style>
</head>
<body>
<main>
<h1>交通量データ取得テスト</h1>
<p class="lead">このページから国土交通省の交通量データ（R3道路交通センサス）を直接読み込めるかを確認します。結果の画面をスクリーンショットで送ってください。</p>

<div class="card">
  <div class="row">
    <button id="gpsBtn">現在地でテスト</button>
    <button id="fixedBtn" class="sub">千葉駅周辺でテスト</button>
  </div>
  <div id="point">地点：未選択</div>
</div>

<div id="verdict" class="verdict"></div>

<div class="card">
  <ul id="log"><li>ボタンを押すとテストを開始します。</li></ul>
</div>

<footer id="env"></footer>
</main>
<script>
const GEO_BASE='https://www.mlit.go.jp/road/ir/ir-data/census_visualizationR3';
const CSV_BASE='https://www.mlit.go.jp/road/census/r3/data/csv';
const ROAD_TYPES=['drm10','drm20','drm31','drm32','drm40_50','drm60_70'];
const $=id=>document.getElementById(id);
$('env').textContent='このページの発信元：'+location.origin+' ／ '+navigator.userAgent;

function tileOf(lat,lng,z){const n=2**z,r=lat*Math.PI/180;return{x:Math.floor((lng+180)/360*n),y:Math.floor((1-Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2*n),z};}
function addLog(label,url){const li=document.createElement('li');li.innerHTML=`<span class="tag wait">確認中</span>${label}<div class="url"></div>`;li.querySelector('.url').textContent=url;$('log').appendChild(li);return li;}
function setTag(li,cls,text,extra){const t=li.querySelector('.tag');t.className='tag '+cls;t.textContent=text;if(extra){const d=document.createElement('div');d.textContent=extra;li.insertBefore(d,li.querySelector('.url'));}}

// 通常の取得（CORS）と、中身を読まない取得（no-cors）を両方試し、
// 「サーバーには届くが読み込みを拒否された」のか「そもそも届かない」のかを区別する。
async function probe(url){
  try{
    const r=await fetch(url,{cache:'no-store'});
    return {cors:true,status:r.status,ok:r.ok,resp:r};
  }catch(e){
    try{await fetch(url,{mode:'no-cors',cache:'no-store'});return {cors:false,reachable:true,error:String(e)};}
    catch(e2){return {cors:false,reachable:false,error:String(e2)};}
  }
}

async function run(lat,lng,label){
  $('gpsBtn').disabled=$('fixedBtn').disabled=true;
  $('point').textContent=`地点：${label}（${lat.toFixed(5)}, ${lng.toFixed(5)}）`;
  $('log').innerHTML='';const v=$('verdict');v.className='verdict';v.innerHTML='';
  const t=tileOf(lat,lng,12);let corsOk=0,corsNg=0,unreachable=0,census=null;
  for(const rt of ROAD_TYPES){
    const url=`${GEO_BASE}/${rt}/${t.z}/${t.x}/${t.y}.geojson`;const li=addLog('道路データ '+rt,url);
    const r=await probe(url);
    if(r.cors){
      corsOk++;
      if(r.ok){try{const j=await r.resp.json();const n=j.features?.length||0;setTag(li,'ok','読込OK',`道路 ${n}件`);
        if(!census)for(const f of j.features||[]){const c=String(f?.properties?.census??'');if(/^\d{11}$/.test(c)){census=c;break;}}}
        catch(_){setTag(li,'ok','読込OK','（JSONではない応答）');}}
      else setTag(li,r.status===404?'warn':'ng','HTTP '+r.status,r.status===404?'この地点にこの種別の道路データなし（正常）':'');
    }else if(r.reachable){corsNg++;setTag(li,'ng','拒否','サーバーには届くが、外部ページからの読み込みが拒否されました');}
    else{unreachable++;setTag(li,'ng','接続不可',r.error);}
  }
  const pref=census?census.slice(0,2):'12';
  const csvUrl=`${CSV_BASE}/kasyo${pref}.csv`;const li=addLog('交通量CSV（都道府県コード '+pref+'）',csvUrl);
  const r=await probe(csvUrl);
  if(r.cors){corsOk++;if(r.ok){const b=await r.resp.arrayBuffer();setTag(li,'ok','読込OK',`${(b.byteLength/1024/1024).toFixed(1)} MB`);}else setTag(li,'ng','HTTP '+r.status);}
  else if(r.reachable){corsNg++;setTag(li,'ng','拒否','サーバーには届くが、外部ページからの読み込みが拒否されました');}
  else{unreachable++;setTag(li,'ng','接続不可',r.error);}

  if(corsNg===0&&unreachable===0&&corsOk>0){v.className='verdict ok';v.innerHTML='結果：直接読み込めます<small>国交省のデータをそのまま使うスマホページが作れます（全国対応）。</small>';}
  else if(corsNg>0&&corsOk===0){v.className='verdict ng';v.innerHTML='結果：直接は読み込めません<small>データを事前に変換してGitHubに置く方式で作ります。</small>';}
  else if(unreachable>0&&corsOk===0&&corsNg===0){v.className='verdict warn';v.innerHTML='結果：国交省のサーバーに接続できません<small>電波状況や社内ネットワークの制限の可能性があります。別の回線で再度お試しください。</small>';}
  else{v.className='verdict warn';v.innerHTML='結果：一部だけ読み込めました<small>このままスクリーンショットを送ってください。</small>';}
  $('gpsBtn').disabled=$('fixedBtn').disabled=false;
}

$('fixedBtn').onclick=()=>run(35.6130,140.1130,'千葉駅周辺');
$('gpsBtn').onclick=()=>{
  if(!navigator.geolocation){alert('この端末では位置情報が使えません');return;}
  $('point').textContent='地点：現在地を取得中…';
  navigator.geolocation.getCurrentPosition(p=>run(p.coords.latitude,p.coords.longitude,'現在地'),
    e=>{$('point').textContent='地点：現在地を取得できませんでした（'+e.message+'）。「千葉駅周辺でテスト」をお試しください。';},
    {enableHighAccuracy:true,timeout:15000});
};
</script>
</body>
</html>
